<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="origin">
    <title>Visor de Estancias Ganadera del Norte</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <!-- Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        #map { height: calc(100vh - 5rem); width: 100%; }
        .custom-modal { animation: fadeIn 0.2s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
    </style>
</head>

<body class="bg-slate-900 flex flex-col h-screen overflow-hidden text-slate-100">

    <header class="bg-slate-900/90 border-b border-slate-800 text-white shadow-md z-10 p-4 flex flex-col md:flex-row items-center justify-between gap-4 backdrop-blur">
        <div class="flex items-center space-x-3" >
            <img src="GN_logo-06.png" width="50px">
            <div>
                <h1 class="text-xl font-bold tracking-tight text-white">Ganadera del Norte</h1>
                <p class="text-xs text-emerald-400 font-medium">Informacion de Padrones</p>
            </div>
        </div>

        <div class="flex flex-wrap items-center gap-3">
            <button onclick="obtenerUbicacionActual()" class="bg-sky-600 hover:bg-sky-500 text-white text-xs font-semibold px-3 py-2 rounded-lg transition shadow flex items-center gap-1.5">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                Mi Ubicación
            </button>
            <div class="flex items-center space-x-2 bg-slate-800 p-1.5 rounded-lg border border-slate-700 shadow-inner">
                <label for="departamentos" class="text-xs font-semibold text-slate-300 px-2">DEPTO:</label>
                <select id="departamentos" class="bg-slate-900 text-white text-sm px-3 py-1.5 rounded focus:outline-none focus:ring-2 focus:ring-emerald-500 border border-slate-700">
                    <option value="" disabled selected>Seleccione</option>
                    <option value="A">CANELONES</option>
                    <option value="B">MALDONADO</option>
                    <option value="C">ROCHA</option>
                    <option value="D">TRENTA Y TRES</option>
                    <option value="E">CERRO LARGO</option>
                    <option value="F">RIVERA</option>
                    <option value="G">ARTIGAS</option>
                    <option value="H">SALTO</option>
                    <option value="I">PAYSANDU</option>
                    <option value="J">RIO NEGRO</option>
                    <option value="K">SORIANO</option>
                    <option value="L">COLONIA</option>
                    <option value="M">SAN JOSE</option>
                    <option value="N">FLORES</option>
                    <option value="O">FLORIDA</option>
                    <option value="P">LAVALLEJA</option>
                    <option value="Q">DURAZNO</option>
                    <option value="R">TACUAREMBO</option>
                    <option value="V">MONTEVIDEO</option>
                </select>
                <label for="padronInput" class="text-xs font-semibold text-slate-300 px-2">PADRÓN:</label>
                <input type="text" id="padronInput" placeholder="Ej: 6964, 6966, 6967, 6968" class="bg-slate-900 text-white placeholder-slate-500 text-sm px-3 py-1.5 rounded focus:outline-none focus:ring-2 focus:ring-emerald-500 w-32 border border-slate-700">               
                <button id="btnBuscar" onclick="buscarPadron(document.getElementById('padronInput').value)" disabled class="bg-emerald-600 hover:bg-emerald-500 disabled:bg-slate-600 disabled:cursor-not-allowed disabled:hover:bg-slate-600 text-white text-sm font-semibold px-4 py-1.5 rounded transition shadow">
                    Buscar
                </button>
            </div>
        </div>
    </header>

    <main class="flex-1 relative">
        <div id="map"></div>
        
        <!-- Info popup card overlay with dual distances -->
        <div id="infoCard" class="absolute bottom-6 right-6 bg-slate-900/95 backdrop-blur-md shadow-2xl rounded-xl p-4 z-[400] max-w-sm hidden border border-slate-700 text-slate-200">
            <div class="flex justify-between items-start mb-2">
                <h3 id="cardTitle" class="font-bold text-emerald-400 text-base">Detalles del Padrón</h3>
                <button onclick="cerrarCard()" class="text-slate-400 hover:text-slate-200 font-bold text-lg">&times;</button>
            </div>
            <div id="cardContent" class="text-xs text-slate-300 space-y-2"></div>
        </div>

        <!-- Custom Notification Modal -->
        <div id="customModal" class="fixed inset-0 bg-slate-950/70 backdrop-blur-sm z-[9999] flex items-center justify-center hidden">
            <div class="bg-slate-900 rounded-xl p-6 max-w-sm w-full shadow-2xl border border-slate-700 custom-modal text-slate-100">
                <div class="flex items-center space-x-3 mb-3 text-amber-400">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
                    </svg>
                    <h3 class="font-bold text-slate-100 text-base">Aviso</h3>
                </div>
                <p id="modalMessage" class="text-sm text-slate-300 mb-5"></p>
                <div class="flex justify-end">
                    <button onclick="cerrarModal()" class="bg-emerald-600 hover:bg-emerald-500 text-white text-sm font-semibold px-4 py-2 rounded-lg transition shadow">Entendido</button>
                </div>
            </div>
        </div>
    </main>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    
    <script>
        const padronInput = document.getElementById('padronInput');
        const departamentoSelect = document.getElementById('departamentos');
        const btnBuscar = document.getElementById('btnBuscar');

        function validarBotonBuscar() {
            const padronValido = padronInput.value.trim() !== '';
            const deptoValido = departamentoSelect.value !== '';
            btnBuscar.disabled = !(padronValido && deptoValido);
        }

        // Escuchar cambios en ambos campos
        padronInput.addEventListener('input', validarBotonBuscar);
        departamentoSelect.addEventListener('change', validarBotonBuscar);

        // Validación inicial (por si el navegador autocompleta)
        validarBotonBuscar();
    </script>
    
    <script>
        
        async function obtenerCoordenadas(numero_padron) {
            
            const inputVal = document.getElementById('padronInput').value.trim();
            const codDepto = document.getElementById('departamentos').value;
            //const dataset = dataPadrones[inputVal];

            if (!inputVal) {
                showAlert("Padrón no encontrado. Ingrese un número válido como 6964, 6966, 6967 o 6968");
                return;
            }
            
            const url = "https://web.snig.gub.uy/arcgisserver/rest/services/Uruguay/SNIG_Catastro/MapServer/0/query?f=json&where=codDepto%20%3D%20%27" + codDepto + "%27%20AND%20NroPadron%20%3D%20" + numero_padron + "%20AND%20SUBSTRING(Codigo%2C%202%2C%202)%20%3D%20%27ZZ%27&returnGeometry=true&spatialRel=esriSpatialRelIntersects&outFields=codDepto%2CDeptoPadron%2CCodigo%2CNroPadron%2CcodLocCat%2COBJECTID%2Ctipo&outSR=32721";

            try {
                const response = await fetch(url, {
                    method: "GET"
                });

                if (!response.ok) {
                    throw new Error(`Error HTTP: ${response.status}`);
                }

                const data = await response.json();

                // Validar que existan features y geometría
                if (!data.features || data.features.length === 0) {
                    showAlert("El padrón ingresado no existe.");
                }

                // Extraer el array de coordenadas del atributo rings
                // rings es un array de anillos (polígonos con posibles huecos), cada anillo es un array de pares [x, y]
                const rings = data.features[0].geometry.rings;

                console.log("Array de coordenadas (rings):", rings);
                console.log("Cantidad de anillos: ", rings.length);
                return rings;

            } catch (error) {
                console.error("Error al obtener las coordenadas:", error);
                return null;
            }
        }

        async function obtenerArea(numero_padron, codigo_depto){

            //"https://web.snig.gub.uy/arcgisserver/rest/services/Uruguay/SNIG_Catastro/MapServer/0/query?f=json&where=codDepto%20%3D%20%27" + codDepto + "%27%20AND%20NroPadron%20%3D%20" + numero_padron + "%20AND%20SUBSTRING(Codigo%2C%202%2C%202)%20%3D%20%27ZZ%27&returnGeometry=true&spatialRel=esriSpatialRelIntersects&outFields=codDepto%2CDeptoPadron%2CCodigo%2CNroPadron%2CcodLocCat%2COBJECTID%2Ctipo&outSR=32721";
            const url = "https://dgrn.mgap.gub.uy/arcgis/rest/services/CONEAT/IndicesConeat/MapServer/0/query?f=json&where=ID2%3D%27" + codigo_depto + "-" + numero_padron + "%27%20&returnGeometry=true&spatialRel=esriSpatialRelIntersects&outFields=*&outSR=102100";

            try{
                const response = await fetch(url, {
                    method: "GET"
                });

                if (!response.ok) {
                    throw new Error(`Error HTTP: ${response.status}`);
                }

                const area = await response.json();

                // Validar que existan features
                if (!area.features || area.features.length === 0) {
                    showAlert("Error al intentar obtener el área.");
                }

                return area.features[0].attributes;

            } catch (error) {
                console.error("Error al obtener el area:", error);
                return null;
            }
        }   

        function buscarPadron(numero_padron){
            // Uso
            obtenerCoordenadas(numero_padron).then(rings => {
                if (rings) {
                    try {

                        //const feature = dataset.features[0];
                        //currentAttributes = feature.attributes;
                        const rings_len = rings.length;
                        //const rings2 = rings.flat();

                        for(var i = 0; i < rings_len; i++){
                            currentPolygonLatLngs = rings[i].map(coord => {
                                const converted = utmToLatLon(coord[0], coord[1], 21, true);
                                return [converted[0], converted[1]];
                            });                

                            currentPolygonLayer = L.polygon(currentPolygonLatLngs, {
                                color: '#34d399',      
                                weight: 3,
                                fillColor: '#10b981',  
                                fillOpacity: 0.00
                            }).addTo(map);

                       } 

                        map.fitBounds(currentPolygonLayer.getBounds(), { padding: [50, 50] });
                        obtenerArea(numero_padron, document.getElementById("departamentos").value).then(area =>{ 
                            currentAttributes = area;
                            actualizarCardConDistancias();

                        });

                    } catch (error) {
                        console.error("Error al buscar padrón:", error);
                        showAlert("Ocurrió un error al procesar la geometría del padrón.");
                    }
                }
            });
        }
        

        // Initialize map centered around Uruguay
        const map = L.map('map').setView([-30.5, -57.0], 11);

        // Add Esri World Imagery Satellite Tile Layer
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 19,
            attribution: 'Tiles &copy; Esri &mdash; Source: Esri, i-cubed, USDA, USGS, AEX, GeoEye, Getmapping, Aerogrid, IGN, IGP, UPR-EGP, and the GIS User Community',
            detectRetina: true
        }).addTo(map);

        let currentPolygonLayer = null;
        let userMarker = null;
        let fallbackMarker = null;
        let userLocationCoords = null;

        // Default fallback location requested
        const fallbackCoords = [-30.4042769, -56.4730174];

        // Add fallback marker initially
        fallbackMarker = L.marker(fallbackCoords, {
            title: "Ubicación por defecto"
        }).addTo(map).bindPopup("<b>Ubicación por defecto</b><br>-30.4042769, -56.4730174");

        function utmToLatLon(easting, northing, zone = 21, southernHemisphere = true) {
            const a = 6378137.0;
            const eccSquared = 0.00669437999014;
            const k0 = 0.9996;

            const e1 = (1 - Math.sqrt(1 - eccSquared)) / (1 + Math.sqrt(1 - eccSquared));

            let x = easting - 500000.0;
            let y = northing;
            if (southernHemisphere) {
                y -= 10000000.0;
            }

            const M = y / k0;
            const mu = M / (a * (1 - eccSquared / 4 - 3 * eccSquared * eccSquared / 64 - 5 * eccSquared * eccSquared * eccSquared / 256));

            const phi1Rad = mu +
                (3 * e1 / 2 - 27 * e1 * e1 * e1 / 32) * Math.sin(2 * mu) +
                (21 * e1 * e1 / 16 - 55 * e1 * e1 * e1 * e1 / 32) * Math.sin(4 * mu) +
                (151 * e1 * e1 * e1 / 96) * Math.sin(6 * mu);

            const N1 = a / Math.sqrt(1 - eccSquared * Math.sin(phi1Rad) * Math.sin(phi1Rad));
            const T1 = Math.tan(phi1Rad) * Math.tan(phi1Rad);
            const C1 = eccSquared * Math.cos(phi1Rad) * Math.cos(phi1Rad) / (1 - eccSquared);
            const R1 = a * (1 - eccSquared) / Math.pow(1 - eccSquared * Math.sin(phi1Rad) * Math.sin(phi1Rad), 1.5);
            const D = x / (N1 * k0);

            const latRad = phi1Rad - (N1 * Math.tan(phi1Rad) / R1) * (
                D * D / 2 -
                (5 + 3 * T1 + 10 * C1 - 4 * C1 * C1 - 9 * eccSquared) * D * D * D * D / 24 +
                (61 + 90 * T1 + 298 * C1 + 45 * T1 * T1 - 252 * eccSquared - 3 * C1 * C1) * D * D * D * D * D * D / 720
            );

            const lonRad = ((D -
                (1 + 2 * T1 + C1) * D * D * D / 6 +
                (5 - 2 * C1 + 28 * T1 - 3 * C1 * C1 + 8 * eccSquared + 24 * T1 * T1) * D * D * D * D * D / 120
            ) / Math.cos(phi1Rad));

            const centralMeridian = (zone * 6 - 183) * Math.PI / 180;
            const lonRadFinal = centralMeridian + lonRad;

            return [latRad * 180 / Math.PI, lonRadFinal * 180 / Math.PI];
        }

        function calcularDistanciaMinima(puntoLatLon, latLngsPolygon) {
            let minDistance = Infinity;
            const p1 = L.latLng(puntoLatLon[0], puntoLatLon[1]);
            
            latLngsPolygon.forEach(coord => {
                const p2 = L.latLng(coord[0], coord[1]);
                const dist = p1.distanceTo(p2); // distance in meters
                if (dist < minDistance) {
                    minDistance = dist;
                }
            });
            return Math.round(minDistance);
        }

        function obtenerUbicacionActual() {
            if (!navigator.geolocation) {
                showAlert("Su navegador no soporta geolocalización.");
                return;
            }

            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    userLocationCoords = [lat, lon];

                    if (userMarker) {
                        map.removeLayer(userMarker);
                    }

                    userMarker = L.marker([lat, lon], {
                        title: "Mi Ubicación GPS"
                    }).addTo(map).bindPopup("<b>Tu ubicación GPS actual</b>").openPopup();

                    map.setView([lat, lon], 13);
                    actualizarCardConDistancias();
                },
                (error) => {
                    console.warn("No se pudo obtener la ubicación GPS, usando fallback:", error);
                    showAlert("No se pudo obtener la ubicación GPS en tiempo real. Posicionando en la ubicación por defecto.");
                    userLocationCoords = fallbackCoords;
                    map.setView(fallbackCoords, 12);
                    actualizarCardConDistancias();
                },
                { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
            );
        }

        let currentAttributes = null;
        let currentPolygonLatLngs = null;

        function seleccionarPadron(padronNum) {
            document.getElementById('padronInput').value = padronNum;
            buscarPadron(padronNum);
        }

        function actualizarCardConDistancias() {
            if (!currentAttributes || !currentPolygonLatLngs) return;

            const card = document.getElementById('infoCard');
            const title = document.getElementById('cardTitle');
            const content = document.getElementById('cardContent');

            const padron_value = document.getElementById('padronInput').value;
            const depto_control = document.getElementById('departamentos');
            const depto_text = depto_control.options[depto_control.selectedIndex].text;

            title.innerText = `Padrón N° ${padron_value}`;

            // Calculate distance from default fallback location
            const distanciaFallback = calcularDistanciaMinima(fallbackCoords, currentPolygonLatLngs);

            // Calculate distance from GPS location if available
            let gpsHtml = `<p class="text-slate-400 italic">GPS: Haga clic en "Mi Ubicación"</p>`;
            if (userLocationCoords) {
                const distanciaGps = calcularDistanciaMinima(userLocationCoords, currentPolygonLatLngs);
                gpsHtml = `<p class="text-sky-300"><strong>Distancia desde GPS:</strong> ${distanciaGps.toLocaleString()} metros</p>`;
            }

            content.innerHTML = `
                <p><strong>Departamento:</strong> ${depto_text}</p>
                <p><strong>Área:</strong> ${currentAttributes.AREAHA} ha (${currentAttributes.AREAMC.toLocaleString()} m²)</p>
                <hr class="border-slate-700 my-1">
                <p class="text-amber-300"><strong>Distancia (Ubicación por defecto):</strong> ${distanciaFallback.toLocaleString()} metros</p>
                ${gpsHtml}
            `;
            card.classList.remove('hidden');
        }

        function cerrarCard() {
            document.getElementById('infoCard').classList.add('hidden');
        }

        function showAlert(msg) {
            document.getElementById('modalMessage').innerText = msg;
            document.getElementById('customModal').classList.remove('hidden');
        }

        function cerrarModal() {
            document.getElementById('customModal').classList.add('hidden');
        }

        window.onload = function() {
            // Default center map to fallback location and select padron 732
            map.setView(fallbackCoords, 11);
            //seleccionarPadron(7442);
        };
    </script>
</body>
