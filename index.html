<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="origin">
    <title>Visor de Estancias Ganadera del Norte</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <!-- Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link href="GN_Styles.css" rel="stylesheet">
    
</head>

<body class="bg-slate-900 flex flex-col h-screen overflow-hidden text-slate-100">

    <header class="bg-slate-900/90 border-b border-slate-800 text-white shadow-md z-10 p-3 sm:p-4 flex flex-col gap-3 md:flex-row md:items-center md:justify-between md:gap-4 backdrop-blur">

        <!-- Logo + título -->
        <div class="flex items-center space-x-3 flex-shrink-0">
            <img src="GN_logo-06.png" width="50px" alt="Logo">
            <div>
                <h1 class="text-lg sm:text-xl font-bold tracking-tight text-white leading-tight">Ganadera del Norte</h1>
                <p class="text-[11px] sm:text-xs text-emerald-400 font-medium">Informacion de Padrones</p>
            </div>
        </div>

        <!-- Controles -->
        <div class="flex flex-col sm:flex-row sm:items-center gap-2 w-full md:w-auto">

            <!-- Botón Mi Ubicación (izquierda) -->
            <button onclick="obtenerUbicacionActual()"
                    class="w-full sm:w-auto bg-sky-600 hover:bg-sky-500 text-white text-xs font-semibold px-3 py-2 rounded-lg transition shadow flex items-center justify-center gap-1.5 flex-shrink-0">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path>
                </svg>
                Mi Ubicación
            </button>

            <!-- Formulario DEPTO + PADRÓN + Buscar -->
            <div class="flex flex-col sm:flex-row sm:items-center gap-2 bg-slate-800 p-2 rounded-lg border border-slate-700 shadow-inner w-full sm:w-auto">

                <!-- DEPTO -->
                <div class="flex items-center gap-2 w-full sm:w-auto">
                    <label for="departamentos"
                        class="text-[11px] sm:text-xs font-semibold text-slate-300 whitespace-nowrap">DEPTO:</label>
                    <select id="departamentos"
                            class="flex-1 sm:flex-none bg-slate-900 text-white text-sm px-2 py-1.5 rounded focus:outline-none focus:ring-2 focus:ring-emerald-500 border border-slate-700 min-w-0">
                            <option data-code="0" value="" disabled selected>Seleccione</option>
                            <option data-code="7" value="G">ARTIGAS</option>
                            <option data-code="1" value="A">CANELONES</option>
                            <option data-code="5" value="E">CERRO LARGO</option>
                            <option data-code="12" value="L">COLONIA</option>
                            <option data-code="17" value="Q">DURAZNO</option>
                            <option data-code="14" value="N">FLORES</option>
                            <option data-code="15" value="O">FLORIDA</option>
                            <option data-code="16" value="P">LAVALLEJA</option>
                            <option data-code="2" value="B">MALDONADO</option>
                            <option data-code="19" value="V">MONTEVIDEO</option>
                            <option data-code="9" value="I">PAYSANDU</option>
                            <option data-code="10" value="J">RIO NEGRO</option>
                            <option data-code="6" value="F">RIVERA</option>
                            <option data-code="3" value="C">ROCHA</option>
                            <option data-code="8" value="H">SALTO</option>
                            <option data-code="13" value="M">SAN JOSE</option>
                            <option data-code="11" value="K">SORIANO</option>
                            <option data-code="18" value="R">TACUAREMBO</option>
                            <option data-code="4" value="D">TRENTA Y TRES</option>
                    </select>
                </div>

                <!-- PADRÓN -->
                <div class="flex items-center gap-2 w-full sm:w-auto">
                    <label for="padronInput"
                        class="text-[11px] sm:text-xs font-semibold text-slate-300 whitespace-nowrap">PADRÓN:</label>
                    <input type="text" id="padronInput"
                        placeholder="Ej: 6964, 6966, 6967, 6968"
                        class="flex-1 sm:flex-none bg-slate-900 text-white placeholder-slate-500 text-sm px-2 py-1.5 rounded focus:outline-none focus:ring-2 focus:ring-emerald-500 border border-slate-700 min-w-0 sm:w-32">
                </div>

                <!-- Botón Buscar -->
                <button id="btnBuscar"
                        onclick="buscarPadron(document.getElementById('padronInput').value, document.getElementById('departamentos').value)"
                        disabled
                        class="w-full sm:w-auto bg-emerald-600 hover:bg-emerald-500 disabled:bg-slate-600 disabled:cursor-not-allowed disabled:hover:bg-slate-600 text-white text-sm font-semibold px-4 py-1.5 rounded transition shadow">
                    Buscar
                </button>
            </div>
        </div>
    </header>

    <!-- Contenedor de padrones recientes -->
    <div id="historialPadrones" class="w-full flex flex-wrap items-center justify-end gap-2 px-4 pb-3 pt-1">
    </div>

    <main class="flex-1 relative">
        <div id="map"></div>
        
        /*
        <!-- Info popup card overlay with dual distances -->
        <div id="infoCard" style="bottom:16%;" class="absolute right-6 bg-slate-900/95 backdrop-blur-md shadow-2xl rounded-xl p-4 z-[400] max-w-sm hidden border border-slate-700 text-slate-200">
            <div class="flex justify-between items-start mb-2">
                <h3 id="cardTitle" class="font-bold text-emerald-400 text-base">Detalles del Padrón</h3>
                <button onclick="cerrarCard()" class="text-slate-400 hover:text-slate-200 font-bold text-lg">&times;</button>
            </div>
            <div id="cardContent" class="text-xs text-slate-300 space-y-2"></div>
        </div>
        */

    <!-- Info popup card overlay with dual distances -->
    <div id="infoCard" style="bottom:16%;"
        class="absolute right-4 md:right-6 bg-slate-900/95 backdrop-blur-md shadow-2xl rounded-xl p-4 z-[400] max-w-sm hidden border border-slate-700 text-slate-200">

        <!-- Cabecera clickeable (colapsa/despliega en móvil) -->
        <div id="infoCardHeader"
            class="flex justify-between items-start mb-2 cursor-pointer md:cursor-default">
            <h3 id="cardTitle" class="font-bold text-emerald-400 text-base">Detalles del Padrón</h3>

            <div class="flex items-center gap-2">
                <!-- Chevron visible solo en móvil (< 800px) -->
                <svg id="infoCardChevron"
                    class="w-4 h-4 text-slate-400 transition-transform duration-200 md:hidden"
                    fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M19 9l-7 7-7-7"></path>
                </svg>
                <!-- Botón cerrar -->
                <button onclick="event.stopPropagation(); cerrarCard()"
                        class="text-slate-400 hover:text-slate-200 font-bold text-lg">&times;</button>
            </div>
        </div>

        <!-- Contenido colapsable en móvil -->
        <div id="cardContent"
            class="text-xs text-slate-300 space-y-2
                    overflow-hidden transition-all duration-300
                    max-h-0 opacity-0 md:max-h-none md:opacity-100">
            <!-- Aquí se inyecta el contenido dinámicamente -->
        </div>
    </div>

        <!-- Custom Notification Modal -->
        <div id="customModal" class="fixed inset-0 bg-slate-950/70 backdrop-blur-sm z-[9999] flex items-center justify-center hidden">
            <div class="bg-slate-900 rounded-xl p-6 max-w-sm w-full shadow-2xl border border-slate-700 custom-modal text-slate-100">
                <div class="flex items-center space-x-3 mb-3 text-amber-400">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
                    </svg>
                    <h3 class="font-bold text-slate-100 text-base">Aviso</h3>
                </div>
                <p id="modalMessage" class="text-sm text-slate-300 mb-5"></p>
                <div class="flex justify-end">
                    <button onclick="cerrarModal()" class="bg-emerald-600 hover:bg-emerald-500 text-white text-sm font-semibold px-4 py-2 rounded-lg transition shadow">Entendido</button>
                </div>
            </div>
        </div>
    </main>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    
    <script src="GN_Script.js"></script>

</body>
</html>
